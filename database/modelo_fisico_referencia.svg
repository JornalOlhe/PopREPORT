<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220"><defs><style>
.bg{fill:#fbfbfb}.tbl{fill:#fff;stroke:#7c8998;stroke-width:1.6}.head{fill:#dbeaf7;stroke:#7c8998;stroke-width:1.6}.assocHead{fill:#e7f5df}.tname{font:700 18px Arial,sans-serif;fill:#1f2933}.col{font:14px 'Courier New',monospace;fill:#26313c}.key{font:700 13px Arial,sans-serif;fill:#8a4f00}.fk{font:700 13px Arial,sans-serif;fill:#265e91}.line{stroke:#586879;stroke-width:2;fill:none}.dash{stroke-dasharray:7 5}.caption{font:700 28px Arial,sans-serif;fill:#1b2530}.sub{font:15px Arial,sans-serif;fill:#637080}.card{font:700 15px Arial,sans-serif;fill:#25313d}
</style></defs><rect class="bg" width="1800" height="1220"/><text class="caption" x="50" y="48">PopReport — Modelo Físico (referência EER)</text><text class="sub" x="50" y="75">Schema: popreport • PK/FK • NOT NULL • UNIQUE • relações 1:N e N:N resolvidas</text><rect class="tbl" x="70" y="150" rx="5" width="360" height="231"/><rect class="head" x="70" y="150" rx="5" width="360" height="42"/><text class="tname" x="82" y="177">artista</text><text class="key" x="82" y="215">PK id INT UNSIGNED AUTO_INCREMENT</text><text class="col" x="82" y="240">   spotify_id VARCHAR(64) UNIQUE</text><text class="col" x="82" y="265">   nome VARCHAR(120) NOT NULL UNIQUE</text><text class="col" x="82" y="290">   imagem_url VARCHAR(500)</text><text class="col" x="82" y="315">   pagina_local VARCHAR(180) UNIQUE</text><text class="col" x="82" y="340">   descricao VARCHAR(800)</text><text class="col" x="82" y="365">   criado_em TIMESTAMP NOT NULL</text><rect class="tbl" x="70" y="540" rx="5" width="360" height="106"/><rect class="head" x="70" y="540" rx="5" width="360" height="42"/><text class="tname" x="82" y="567">genero</text><text class="key" x="82" y="605">PK id INT UNSIGNED AUTO_INCREMENT</text><text class="col" x="82" y="630">   nome VARCHAR(80) NOT NULL UNIQUE</text><rect class="tbl" x="540" y="330" rx="5" width="400" height="156"/><rect class="head assocHead" x="540" y="330" rx="5" width="400" height="42"/><text class="tname" x="552" y="357">artista_genero</text><text class="key" x="552" y="395">PK artista_id INT UNSIGNED</text><text class="key" x="552" y="420">PK genero_id INT UNSIGNED</text><text class="fk" x="552" y="445">FK artista_id → artista.id</text><text class="fk" x="552" y="470">FK genero_id → genero.id</text><rect class="tbl" x="1060" y="140" rx="5" width="390" height="256"/><rect class="head" x="1060" y="140" rx="5" width="390" height="42"/><text class="tname" x="1072" y="167">album</text><text class="key" x="1072" y="205">PK id INT UNSIGNED AUTO_INCREMENT</text><text class="fk" x="1072" y="230">FK artista_id → artista.id</text><text class="col" x="1072" y="255">   spotify_id VARCHAR(64) UNIQUE</text><text class="col" x="1072" y="280">   titulo VARCHAR(180) NOT NULL</text><text class="col" x="1072" y="305">   imagem_url VARCHAR(500)</text><text class="col" x="1072" y="330">   ano_lancamento SMALLINT UNSIGNED</text><text class="col" x="1072" y="355">   link_spotify VARCHAR(500) UNIQUE</text><text class="col" x="1072" y="380">   UNIQUE (artista_id, titulo)</text><rect class="tbl" x="1060" y="560" rx="5" width="390" height="256"/><rect class="head" x="1060" y="560" rx="5" width="390" height="42"/><text class="tname" x="1072" y="587">musica</text><text class="key" x="1072" y="625">PK id INT UNSIGNED AUTO_INCREMENT</text><text class="fk" x="1072" y="650">FK album_id → album.id</text><text class="col" x="1072" y="675">   spotify_id VARCHAR(64) NOT NULL UNIQUE</text><text class="col" x="1072" y="700">   titulo VARCHAR(180) NOT NULL</text><text class="col" x="1072" y="725">   duracao_ms INT UNSIGNED NOT NULL</text><text class="col" x="1072" y="750">   explicita BOOLEAN NOT NULL</text><text class="col" x="1072" y="775">   numero_faixa SMALLINT UNSIGNED NOT NULL</text><text class="col" x="1072" y="800">   link_spotify VARCHAR(500) NOT NULL UNIQUE</text><rect class="tbl" x="70" y="850" rx="5" width="360" height="156"/><rect class="head" x="70" y="850" rx="5" width="360" height="42"/><text class="tname" x="82" y="877">usuario</text><text class="key" x="82" y="915">PK id INT UNSIGNED AUTO_INCREMENT</text><text class="col" x="82" y="940">   nome VARCHAR(100) NOT NULL</text><text class="col" x="82" y="965">   email VARCHAR(190) NOT NULL UNIQUE</text><text class="col" x="82" y="990">   criado_em TIMESTAMP NOT NULL</text><rect class="tbl" x="540" y="830" rx="5" width="400" height="181"/><rect class="head" x="540" y="830" rx="5" width="400" height="42"/><text class="tname" x="552" y="857">playlist</text><text class="key" x="552" y="895">PK id INT UNSIGNED AUTO_INCREMENT</text><text class="fk" x="552" y="920">FK usuario_id → usuario.id</text><text class="col" x="552" y="945">   nome VARCHAR(120) NOT NULL</text><text class="col" x="552" y="970">   descricao VARCHAR(300)</text><text class="col" x="552" y="995">   UNIQUE (usuario_id, nome)</text><rect class="tbl" x="1310" y="900" rx="5" width="420" height="206"/><rect class="head assocHead" x="1310" y="900" rx="5" width="420" height="42"/><text class="tname" x="1322" y="927">playlist_musica</text><text class="key" x="1322" y="965">PK playlist_id INT UNSIGNED</text><text class="key" x="1322" y="990">PK musica_id INT UNSIGNED</text><text class="fk" x="1322" y="1015">FK playlist_id → playlist.id</text><text class="fk" x="1322" y="1040">FK musica_id → musica.id</text><text class="col" x="1322" y="1065">   ordem SMALLINT UNSIGNED NOT NULL</text><text class="col" x="1322" y="1090">   UNIQUE (playlist_id, ordem)</text><path class="line" d="M430 250 H760 V220 H1060"/><text class="card" x="445" y="238">1</text><text class="card" x="1036" y="208">N</text><path class="line dash" d="M540 390 H485 V315 H430"/><text class="card" x="505" y="377">N</text><text class="card" x="443" y="302">1</text><path class="line dash" d="M540 455 H480 V610 H430"/><text class="card" x="505" y="444">N</text><text class="card" x="443" y="598">1</text><path class="line" d="M1255 382 V560"/><text class="card" x="1268" y="410">1</text><text class="card" x="1268" y="548">N</text><path class="line" d="M430 930 H540"/><text class="card" x="443" y="918">1</text><text class="card" x="515" y="918">N</text><path class="line dash" d="M940 930 H1310"/><text class="card" x="954" y="918">1</text><text class="card" x="1285" y="918">N</text><path class="line dash" d="M1450 790 V900"/><text class="card" x="1464" y="818">1</text><text class="card" x="1464" y="887">N</text></svg>
